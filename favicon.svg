<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

  <defs>
    <style>
      .o { stroke:#1f2937; stroke-width:1.8; stroke-linejoin:round; }
    </style>
  </defs>

  <!-- Верх -->
  <polygon class="o" fill="#ffffff"
    points="32 4 56 16 32 28 8 16"/>

  <!-- Левая грань -->
  <polygon class="o" fill="#2563eb"
    points="8 16 32 28 32 56 8 44"/>

  <!-- Правая грань -->
  <polygon class="o" fill="#ef4444"
    points="56 16 32 28 32 56 56 44"/>

  <!-- Деление верхней грани -->
  <line x1="24" y1="8"  x2="48" y2="20" class="o"/>
  <line x1="16" y1="12" x2="40" y2="24" class="o"/>
  <line x1="40" y1="8"  x2="16" y2="20" class="o"/>
  <line x1="48" y1="12" x2="24" y2="24" class="o"/>

  <!-- Деление левой -->
  <line x1="16" y1="20" x2="16" y2="48" class="o"/>
  <line x1="24" y1="24" x2="24" y2="52" class="o"/>
  <line x1="8"  y1="25" x2="32" y2="37" class="o"/>
  <line x1="8"  y1="35" x2="32" y2="47" class="o"/>

  <!-- Деление правой -->
  <line x1="40" y1="24" x2="40" y2="52" class="o"/>
  <line x1="48" y1="20" x2="48" y2="48" class="o"/>
  <line x1="32" y1="37" x2="56" y2="25" class="o"/>
  <line x1="32" y1="47" x2="56" y2="35" class="o"/>

</svg>

